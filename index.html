<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leadership Is Followership</title>
<meta name="description" content="Team 4's leader interview presentation on Roger W. Ferguson Jr.">
<style>
  :root { --bg: #1a1c21; --ink: #ecebe6; --muted: #9aa0ab; --btn: #2a2e36; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0 auto 0 0; }
  a.btn, button {
    background: var(--btn); color: var(--ink); border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; cursor: pointer; text-decoration: none;
  }
  a.btn:hover, button:hover { background: #3a3f49; }
  button:disabled { opacity: .35; cursor: default; }
  main {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 8px 16px;
  }
  main img {
    max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9;
    object-fit: contain; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
    background: #fff; user-select: none;
  }
  footer {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 12px 16px 16px;
  }
  #count { color: var(--muted); min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <header>
    <h1>Leadership Is Followership: Roger W. Ferguson Jr.</h1>
    <a class="btn" href="presentation.pdf" target="_blank" rel="noopener">Open PDF</a>
    <button id="fs">Fullscreen</button>
  </header>
  <main id="stage">
    <img id="slide" src="slides/slide-1.png" alt="Slide 1">
  </main>
  <footer>
    <button id="prev" aria-label="Previous slide">← Prev</button>
    <span id="count">1 / 8</span>
    <button id="next" aria-label="Next slide">Next →</button>
  </footer>
<script>
  const total = 8;
  let i = 1;
  const img = document.getElementById('slide');
  const count = document.getElementById('count');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');

  for (let n = 2; n <= total; n++) new Image().src = `slides/slide-${n}.png`;

  function show(n) {
    i = Math.min(Math.max(n, 1), total);
    img.src = `slides/slide-${i}.png`;
    img.alt = `Slide ${i}`;
    count.textContent = `${i} / ${total}`;
    prev.disabled = i === 1;
    next.disabled = i === total;
    history.replaceState(null, '', `#${i}`);
  }

  prev.onclick = () => show(i - 1);
  next.onclick = () => show(i + 1);
  img.onclick = () => show(i + 1);
  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(i + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(i - 1); }
  });

  let x0 = null;
  img.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  img.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  });

  document.getElementById('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.getElementById('stage').requestFullscreen?.();
  };

  show(parseInt(location.hash.slice(1)) || 1);
</script>
</body>
</html>
